nelmio_security:
    # Interdit l'affichage du site dans une iframe (clickjacking)
    clickjacking:
        paths:
            '^/.*': DENY

    content_type:
        nosniff: true

    referrer_policy:
        enabled: true
        policies:
            - 'no-referrer'
            - 'strict-origin-when-cross-origin'

when@prod:
    nelmio_security:
        # Force HTTPS et HSTS (1 an)
        forced_ssl:
            hsts_max_age: 31536000
            hsts_subdomains: true

        # Scripts inline autorisés uniquement via nonce : {{ csp_nonce('script') }}
        # Jamais de « data: » dans script-src : les feuilles de style ne doivent donc pas être importées
        # dans le JavaScript (AssetMapper les transformerait en modules data:), mais chargées en <link>.
        # Stripe : https://docs.stripe.com/security/guide#content-security-policy
        # Google Tag Manager / Analytics (chargés seulement après consentement) :
        # https://developers.google.com/tag-platform/security/guides/csp
        csp:
            enabled: true
            enforce:
                level1_fallback: false
                default-src: ["'self'"]
                script-src: ["'self'", 'https://js.stripe.com', 'https://*.js.stripe.com', 'https://www.googletagmanager.com']
                style-src: ["'self'"]
                img-src: ["'self'", 'data:', 'https://*.stripe.com', 'https://www.googletagmanager.com', 'https://*.google-analytics.com']
                font-src: ["'self'"]
                connect-src: ["'self'", 'https://api.stripe.com', 'https://www.googletagmanager.com', 'https://*.google-analytics.com', 'https://*.analytics.google.com']
                frame-src: ['https://js.stripe.com', 'https://*.js.stripe.com', 'https://hooks.stripe.com']
                form-action: ["'self'"]
                frame-ancestors: ["'none'"]
                base-uri: ["'self'"]
                object-src: ["'none'"]
                upgrade-insecure-requests: true
