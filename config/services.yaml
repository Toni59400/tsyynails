# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Coordonnées affichées sur le site (pied de page, infos pratiques, données structurées, mentions légales).
    # VALEURS PROVISOIRES : à remplacer par les vraies informations avant la mise en ligne.
    app.salon:
        nom: 'Tsyynails'
        activite: 'Prothésiste ongulaire'
        adresse: "16 rue du Roussillon"
        code_postal: '62000'
        ville: 'Arras'
        telephone: '+33622176077'
        email: 'tsyyart@gmail.com'
        instagram: 'https://www.instagram.com/tsyynails'
        acces: 'Stationnement gratuit dans la rue. Salon au rez-de-chaussée, accessible en fauteuil roulant.'
        responsable_publication: 'Gipsy Pira'
        siret: 'À compléter'
        # Référencement local. Coordonnées : Base Adresse Nationale (api-adresse.data.gouv.fr).
        latitude: '50.269614'
        longitude: '2.788523'
        # Communes citées comme zone desservie (données structurées, textes), séparées par des virgules.
        zone: 'Arras, Saint-Laurent-Blangy, Achicourt, Dainville, Beaurains, Sainte-Catherine, Saint-Nicolas'

    # Photos de la galerie, hors du dépôt Git
    app.dossier_galerie: '%kernel.project_dir%/public/uploads/galerie'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Stripe, ou simulation en développement sans clés (voir FabriquePaiementGateway)
    App\Service\Paiement\PaiementGateway:
        factory: ['@App\Service\Paiement\FabriquePaiementGateway', 'creer']
        lazy: true

when@test:
    parameters:
        app.dossier_galerie: '%kernel.project_dir%/var/test/galerie'
    services:
        App\Tests\Double\ReponsesHttpSimulees: ~
